name: V6.1 Final Origin Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ startsWith(github.head_ref, 'v6-final-origin-fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply final auth Origin handling and revision marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/v5-entry.js')
          s=p.read_text()
          s=s.replace("const BUILD='2026-08-22-security-hardening-v6';","const BUILD='2026-08-22-security-hardening-v6.1';",1)
          old="if(url.pathname==='/api/auth/login'&&m==='POST'){checkOrigin(req,url);return login(req,env,url);}\n  if(url.pathname==='/api/auth/logout'&&m==='POST'){checkOrigin(req,url);return logout(req,env,url);}"
          new="if(url.pathname==='/api/auth/login'&&m==='POST'){const o=req.headers.get('origin');if(o&&o!==url.origin)return json({status:'error',message:'Origin not allowed'},403);return login(req,env,url);}\n  if(url.pathname==='/api/auth/logout'&&m==='POST'){const o=req.headers.get('origin');if(o&&o!==url.origin)return json({status:'error',message:'Origin not allowed'},403);return logout(req,env,url);}"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('Auth Origin dispatch marker not found')
          old_dispatch="if(url.pathname.startsWith('/api/'))return api(request,env,url);"
          new_dispatch="if(url.pathname.startsWith('/api/'))return await api(request,env,url);"
          if old_dispatch in s:s=s.replace(old_dispatch,new_dispatch,1)
          if new_dispatch not in s:raise SystemExit('Awaited API dispatch missing')
          s=s.replace("security:'rate-limit+origin+money-rounding'","security:'rate-limit+origin-direct+money-rounding',boundary:'await-api'",1)
          p.write_text(s)
          PY

          node --check worker/v5-entry.js
          npm test
          grep -q "2026-08-22-security-hardening-v6.1" worker/v5-entry.js
          grep -q "boundary:'await-api'" worker/v5-entry.js
          grep -q "Origin not allowed'},403" worker/v5-entry.js

      - name: Commit fix to PR branch
        run: |
          git config user.name "claim-center-v6-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add worker/v5-entry.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: finalize V6.1 auth Origin handling"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
