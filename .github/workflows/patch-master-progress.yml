name: Patch Master Upload Progress

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-master-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only Master Article overlay progress
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('site/app.js')
          text = path.read_text(encoding='utf-8')
          pattern = r"async function replaceMaster\(\)\{.*?\}\nasync function prepareHistory"
          replacement = r'''async function replaceMaster(){if(!state.master)return;if(!confirm('Replace Master Article ชุดปัจจุบันด้วยไฟล์นี้?'))return;const m=state.master;busy(true,`กำลังเตรียมอัปโหลด Master Article · 0 / ${numberFmt.format(m.rows.length)} (0%)`);try{const start=await api('/api/master-article/start',{method:'POST',body:{fileName:m.file,sheetName:m.sheet,totalRows:m.rows.length,headers:m.headers}});for(let i=0;i<m.rows.length;i+=20){await api('/api/master-article/chunk',{method:'POST',body:{batchId:start.batchId,rows:m.rows.slice(i,i+20)}});const done=Math.min(i+20,m.rows.length);const pct=Math.round(Math.min(100,done/m.rows.length*100));busy(true,`กำลังอัปโหลด Master Article · ${numberFmt.format(done)} / ${numberFmt.format(m.rows.length)} (${pct}%)`);$('#masterProgress i').style.width=pct+'%';$('#masterProgressText').textContent=`Uploading ${done} / ${m.rows.length}`;}busy(true,`กำลังเปิดใช้งาน Master Article · ${numberFmt.format(m.rows.length)} / ${numberFmt.format(m.rows.length)} (100%)`);await api('/api/master-article/finalize',{method:'POST',body:{batchId:start.batchId}});toast('Master Article Active แล้ว',`${m.rows.length} source rows`,'success');state.master=null;$('#replaceMaster').disabled=true;$('#masterArticleFile').value='';$('#masterProgress i').style.width='100%';loadMasterStatus();}catch(e){toast('Replace Master',e.message,'error')}finally{busy(false)}}
async function prepareHistory'''
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one replaceMaster function, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
          node --check site/app.js
          rm -f .github/workflows/patch-master-progress.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: display Master Article upload progress" || exit 0
          git push
