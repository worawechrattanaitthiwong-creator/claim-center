name: Production Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Collaboration V7
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://claim-center.worawech-rattanaitthiwong.workers.dev"
          ok=0
          for i in $(seq 1 40); do
            BUILD=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/build" || true)
            HEALTH=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/health" || true)
            HTML=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/" || true)
            APP=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/app.js?v=smoke-v7" || true)
            if echo "$BUILD" | grep -q '2026-08-22-collaboration-v7' \
              && echo "$HEALTH" | grep -q '"status":"success"' \
              && echo "$HTML" | grep -q 'Claim Center · Collaboration V7' \
              && echo "$HTML" | grep -q 'Claim Workbench' \
              && echo "$HTML" | grep -q 'Store Queue' \
              && echo "$HTML" | grep -q 'Export Studio' \
              && echo "$APP" | grep -q 'syncReference' \
              && echo "$APP" | grep -q 'submitStoreCase'; then
              echo "Production V7 is live"
              echo "$BUILD"
              ok=1
              break
            fi
            echo "Attempt $i: not ready: ${BUILD:0:140}"
            sleep 15
          done
          test "$ok" = "1"
      - name: Verify auth protection
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://claim-center.worawech-rattanaitthiwong.workers.dev"
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data '{"username":"__smoke_invalid__","password":"__smoke_invalid__"}' "$BASE/api/auth/login")
          test "$code" = "401"
          origin_code=$(curl -sS -o /tmp/origin.json -w '%{http_code}' -H 'content-type: application/json' -H 'Origin: https://example.invalid' --data '{"username":"__origin_test__","password":"__origin_test__"}' "$BASE/api/auth/login")
          test "$origin_code" = "403"
