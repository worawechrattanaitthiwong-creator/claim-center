name: Production Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Store/DC Workflow V8
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://claim-center.worawech-rattanaitthiwong.workers.dev"
          ok=0
          for i in $(seq 1 30); do
            BUILD=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/build" || true)
            HEALTH=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/health" || true)
            HTML=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/" || true)
            V8=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/v8.js?v=smoke-v8" || true)
            COMPAT=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/v8-compat.js?v=smoke-compat" || true)
            if [[ "$BUILD" == *"2026-08-22-store-dc-workflow-v8"* ]] \
              && [[ "$HEALTH" == *'"status":"success"'* ]] \
              && [[ "$HTML" == *"Claim Center · Store & DC Operations"* ]] \
              && [[ "$HTML" == *"Claim Workbench"* ]] \
              && [[ "$HTML" == *"Store Queue"* ]] \
              && [[ "$HTML" == *"v8.js"* ]] \
              && [[ "$HTML" != *"CCD columns A:AQ"* ]] \
              && [[ "$V8" == *"1 Transport = 1 Ticket"* ]] \
              && [[ "$V8" == *"Backup & Restore"* ]] \
              && [[ "$V8" == *"Dropdown Settings"* ]] \
              && [[ "$COMPAT" == *"Decision สำหรับทั้ง Claim"* ]] \
              && [[ "$COMPAT" == *"installReliableLogin"* ]]; then
              echo "Production V8 compatibility layer is live"
              echo "$BUILD"
              ok=1
              break
            fi
            echo "Attempt $i: production not ready: ${BUILD:0:180}"
            sleep 10
          done
          test "$ok" = "1"
      - name: Verify auth protection
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://claim-center.worawech-rattanaitthiwong.workers.dev"
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data '{"username":"__smoke_invalid__","password":"__smoke_invalid__"}' "$BASE/api/auth/login")
          test "$code" = "401"
          origin_code=$(curl -sS -o /tmp/origin.json -w '%{http_code}' -H 'content-type: application/json' -H 'Origin: https://example.invalid' --data '{"username":"__origin_test__","password":"__origin_test__"}' "$BASE/api/auth/login")
          test "$origin_code" = "403"
