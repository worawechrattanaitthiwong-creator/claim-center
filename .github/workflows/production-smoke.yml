name: Production Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Store/DC Workflow V8.1 observer repair
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://claim-center.worawech-rattanaitthiwong.workers.dev"
          EVENT_NAME="${{ github.event_name }}"
          ok=0
          for i in $(seq 1 30); do
            BUILD=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/build" || true)
            HEALTH=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/api/health" || true)
            HTML=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/" || true)
            V8=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/v8.js?v=20260822-observerfix1&smoke=observer" || true)
            COMPAT=$(curl -fsS --connect-timeout 10 --max-time 20 "$BASE/v8-compat.js?v=20260822-observerfix1&smoke=observer" || true)
            if [[ "$BUILD" == *"2026-08-22-store-dc-workflow-v8"* ]] \
              && [[ "$HEALTH" == *'"status":"success"'* ]] \
              && [[ "$HTML" == *"Claim Center · Store & DC Operations"* ]] \
              && [[ "$HTML" == *"Claim Workbench"* ]] \
              && [[ "$HTML" == *"Store Queue"* ]] \
              && [[ "$HTML" == *"v8.js?v=20260822-observerfix1"* ]] \
              && [[ "$HTML" == *"v8-compat.js?v=20260822-observerfix1"* ]] \
              && [[ "$HTML" != *"CCD columns A:AQ"* ]] \
              && [[ "$V8" == *"const syncLoginBuild = () =>"* ]] \
              && [[ "$V8" == *"if (current !== 'พร้อมใช้งาน') loginBuild.textContent = 'พร้อมใช้งาน';"* ]] \
              && [[ "$V8" == *"if (after !== before) preview.textContent = after;"* ]] \
              && [[ "$V8" != *"if (!/ไม่สามารถ/.test(loginBuild.textContent)) loginBuild.textContent = 'พร้อมใช้งาน';"* ]] \
              && [[ "$V8" != *"preview.textContent = preview.textContent.replace"* ]] \
              && [[ "$V8" == *"1 Transport = 1 Ticket"* ]] \
              && [[ "$V8" == *"ค้นหาด้วย Transport"* ]] \
              && [[ "$V8" == *"ไม่จำเป็นต้องจำ Article"* ]] \
              && [[ "$V8" == *"v8StoreMasterDetails"* ]] \
              && [[ "$V8" == *"Store Data · Read only"* ]] \
              && [[ "$V8" == *"Backup & Restore"* ]] \
              && [[ "$V8" == *"Dropdown Settings"* ]] \
              && [[ "$COMPAT" == *"const sameOptions = currentValues.length === desiredValues.length"* ]] \
              && [[ "$COMPAT" == *"observer.disconnect();"* ]] \
              && [[ "$COMPAT" == *"observeDropdownContainer"* ]] \
              && [[ "$COMPAT" == *"Decision สำหรับทั้ง Claim"* ]] \
              && [[ "$COMPAT" == *"oldForm.cloneNode(true)"* ]] \
              && [[ "$COMPAT" == *"ไม่สามารถยืนยัน Session หลังเข้าสู่ระบบ"* ]] \
              && [[ "$COMPAT" == *"Decision Master"* ]]; then
              echo "Production observer loop repair is live${EVENT_NAME:+ ($EVENT_NAME)}"
              echo "$BUILD"
              ok=1
              break
            fi
            echo "Attempt $i: production observer repair not ready: ${BUILD:0:180}"
            sleep 10
          done
          test "$ok" = "1"
      - name: Verify auth protection
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://claim-center.worawech-rattanaitthiwong.workers.dev"
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' -H 'content-type: application/json' --data '{"username":"__smoke_invalid__","password":"__smoke_invalid__"}' "$BASE/api/auth/login")
          test "$code" = "401"
          origin_code=$(curl -sS -o /tmp/origin.json -w '%{http_code}' -H 'content-type: application/json' -H 'Origin: https://example.invalid' --data '{"username":"__origin_test__","password":"__origin_test__"}' "$BASE/api/auth/login")
          test "$origin_code" = "403"
